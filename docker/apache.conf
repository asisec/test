<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # DocumentRoot = public_html (Laravel'in index.php'si burada)
    DocumentRoot /var/www/html/public_html

    <Directory /var/www/html/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Laravel storage symlink desteği
    <Directory /var/www/html/public_html/core/storage>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
